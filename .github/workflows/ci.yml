name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matsci_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matsci_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matsci_agent
      # Also runs the persistence tests against the real database above.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/matsci_agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Lint (syntax errors, undefined names, unused imports)
        run: uv run ruff check --select F,E9 src tests scripts
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q
      - name: Evaluation smoke test (rule-based, no LLM key)
        # Runs the extraction benchmark and whole-pipeline invariants on the shipped corpus; the invariants are
        # also asserted by tests, this step proves the CLI and report generation work end to end.
        run: uv run python scripts/run_evals.py --suite extraction,e2e
