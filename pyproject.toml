[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "matsci-agent-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for the MatSci research agent platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "anthropic>=1.7",
  "arxiv>=2.1.0",
  "asyncpg>=0.29",
  "chromadb>=0.5",
  "fastapi>=0.115",
  "httpx>=0.27",
  "joblib>=1.4",
  "langgraph>=0.2",
  "matminer>=0.9",
  "mp-api>=0.41",
  "numpy>=1.26",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyMuPDF>=1.24.5",
  "pymatgen>=2024.6",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
pinecone = [
  "pinecone>=5",
]
dev = [
  "aiosqlite>=0.20",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "types-python-dateutil>=2.9.0.20240706",
]

[project.scripts]
ingest-papers = "scripts.ingest_papers:main"
train-krr = "scripts.train_krr:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matsci_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["matsci_agent"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

